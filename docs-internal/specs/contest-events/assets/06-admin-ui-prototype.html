<!--
  PROTOTYPE - throwaway. Answers issue 06: staff/admin contest-event surfaces.
  Three screens (Events tab list / create-edit form / winner pick), 3 variants each,
  switched from the floating bar (or arrow keys). The form screen's variants are the
  three candidate answers to the "announcement events vs broadcast composer" fog item.
  Role toggle (admin/staff) shows the gating split: CRUD is admin-only, winner pick is
  any staff (per issue 03/04 contracts). Styling mirrors src/index.css tokens +
  tailwind.config.js type roles; chrome mirrors AdminPanelDialog / BroadcastsTab.
-->
<title>Contest Admin Surfaces</title>
<style>
  html {
    color-scheme: light;
    --background: 0 0% 100%;
    --foreground: 222.2 84% 4.9%;
    --card: 210 40% 97%;
    --card-foreground: 222.2 84% 4.9%;
    --popover: 0 0% 100%;
    --popover-foreground: 222.2 84% 4.9%;
    --primary: 180 47.4% 75%;
    --primary-foreground: 180 47.4% 11.2%;
    --secondary: 210 40% 96.1%;
    --secondary-foreground: 222.2 47.4% 11.2%;
    --muted: 210 40% 96.1%;
    --muted-foreground: 215.4 16.3% 46.9%;
    --accent: 210 40% 96.1%;
    --accent-foreground: 222.2 47.4% 11.2%;
    --destructive: 0 84.2% 60.2%;
    --success: 142 71% 40%;
    --warning: 45 93% 50%;
    --warning-foreground: 38 92% 12%;
    --info: 217 84% 56%;
    --info-foreground: 210 40% 98%;
    --overlay: 0 0% 0%;
    --border: 214.3 31.8% 91.4%;
    --input: 214.3 31.8% 91.4%;
    --ring: 222.2 84% 4.9%;
    --radius: 0.5rem;
  }
  html.dark {
    color-scheme: dark;
    --background: 222.2 84% 4.9%;
    --foreground: 210 40% 98%;
    --card: 222 40% 9%;
    --card-foreground: 210 40% 98%;
    --popover: 222.2 84% 4.9%;
    --popover-foreground: 210 40% 98%;
    --primary: 180 40% 85%;
    --primary-foreground: 180 47.4% 11.2%;
    --secondary: 217.2 32.6% 17.5%;
    --secondary-foreground: 210 40% 98%;
    --muted: 217.2 32.6% 17.5%;
    --muted-foreground: 215 20.2% 65.1%;
    --accent: 217.2 32.6% 17.5%;
    --accent-foreground: 210 40% 98%;
    --destructive: 0 72% 58%;
    --success: 142 65% 45%;
    --warning: 45 93% 55%;
    --warning-foreground: 38 92% 12%;
    --info: 217 84% 60%;
    --info-foreground: 210 40% 98%;
    --border: 217.2 32.6% 17.5%;
    --input: 217.2 32.6% 17.5%;
    --ring: 212.7 26.8% 83.9%;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: hsl(var(--muted));
    color: hsl(var(--foreground));
    font-size: 16px;
    overflow: hidden;
  }
  svg { flex-shrink: 0; }

  /* ---- type roles (tailwind.config.js) ---- */
  .t-display { font-size: 1.5rem;   line-height: 2rem;    }
  .t-heading { font-size: 1.25rem;  line-height: 1.75rem; }
  .t-title   { font-size: 1.125rem; line-height: 1.75rem; }
  .t-body    { font-size: 1rem;     line-height: 1.5rem;  }
  .t-label   { font-size: 0.875rem; line-height: 1.25rem; }
  .t-meta    { font-size: 0.75rem;  line-height: 1rem;    }
  .fw-med  { font-weight: 500; }
  .fw-semi { font-weight: 600; }
  .muted { color: hsl(var(--muted-foreground)); }

  /* ---- frame ---- */
  #frameWrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #app {
    width: 100%; height: 100%;
    background: hsl(var(--muted));
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }
  body.mobile #frameWrap { padding: 12px 0 96px; }
  body.mobile #app {
    width: 390px; height: min(760px, calc(100vh - 120px));
    border: 6px solid hsl(var(--foreground) / 0.8);
    border-radius: 24px;
    box-shadow: 0 20px 60px hsl(var(--overlay) / 0.35);
  }

  /* ---- shadcn-ish primitives ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    border-radius: calc(var(--radius) - 2px);
    font-size: 0.875rem; line-height: 1.25rem; font-weight: 500;
    height: 2.25rem; padding: 0 1rem;
    border: 1px solid transparent; background: transparent; color: inherit;
    cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .btn:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 1px; }
  .btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
  .btn-primary:hover { background: hsl(var(--primary) / 0.9); }
  .btn-outline { border-color: hsl(var(--input)); background: hsl(var(--background)); }
  .btn-outline:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
  .btn-ghost:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
  .btn-destructive { color: hsl(var(--destructive)); }
  .btn-destructive:hover { background: hsl(var(--destructive) / 0.1); }
  .btn-sm { height: 2rem; padding: 0 0.75rem; }
  .btn-xs { height: 1.6rem; padding: 0 0.6rem; font-size: 0.75rem; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

  .tabs-list {
    display: grid; gap: 2px;
    background: hsl(var(--muted)); border-radius: calc(var(--radius) - 2px);
    padding: 4px; width: 100%;
  }
  .tab {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    border: none; background: transparent; color: hsl(var(--muted-foreground));
    font: inherit; font-size: 0.875rem; font-weight: 500; line-height: 1.25rem;
    padding: 0.25rem 0.5rem; border-radius: calc(var(--radius) - 4px);
    cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active { background: hsl(var(--background)); color: hsl(var(--foreground)); box-shadow: 0 1px 2px hsl(var(--overlay) / 0.1); }

  .input, .textarea, .selectbox {
    width: 100%;
    padding: 0.4rem 0.75rem;
    border: 1px solid hsl(var(--input)); border-radius: calc(var(--radius) - 2px);
    background: hsl(var(--background)); color: hsl(var(--foreground));
    font: inherit; font-size: 0.875rem; line-height: 1.25rem;
  }
  .input { height: 2.25rem; }
  .textarea { min-height: 4.5rem; resize: vertical; }
  .selectbox { height: 2.25rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; cursor: default; }
  .field { display: flex; flex-direction: column; gap: 0.3rem; }
  .field label { font-size: 0.875rem; font-weight: 500; line-height: 1.25rem; }
  .field .hint { font-size: 0.75rem; line-height: 1rem; color: hsl(var(--muted-foreground)); }
  .field-row { display: flex; gap: 0.75rem; }
  .field-row .field { flex: 1; }
  body.mobile .field-row { flex-direction: column; }

  .badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    border-radius: 9999px; padding: 0.1rem 0.6rem;
    font-size: 0.75rem; line-height: 1rem; font-weight: 600; white-space: nowrap;
  }
  .badge-active    { background: hsl(var(--success) / 0.15); color: hsl(var(--success)); }
  .badge-judging   { background: hsl(var(--warning) / 0.2);  color: hsl(var(--warning-foreground)); }
  html.dark .badge-judging { color: hsl(var(--warning)); }
  .badge-scheduled { background: hsl(var(--info) / 0.15);    color: hsl(var(--info)); }
  .badge-ended     { background: hsl(var(--muted));          color: hsl(var(--muted-foreground)); }
  .badge-cancelled { background: hsl(var(--destructive) / 0.12); color: hsl(var(--destructive)); }
  .badge-type {
    background: hsl(var(--secondary)); color: hsl(var(--secondary-foreground));
    font-weight: 500;
  }

  .switch {
    width: 2.25rem; height: 1.25rem; border-radius: 9999px;
    background: hsl(var(--input)); position: relative; flex-shrink: 0; transition: background 0.15s;
    cursor: pointer;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 1rem; height: 1rem; border-radius: 9999px; background: hsl(var(--background));
    box-shadow: 0 1px 2px hsl(var(--overlay) / 0.3); transition: left 0.15s;
  }
  .switch.on { background: hsl(var(--primary)); }
  .switch.on::after { left: calc(100% - 1.125rem); }

  .radio {
    width: 1rem; height: 1rem; flex-shrink: 0; border-radius: 9999px;
    border: 1px solid hsl(var(--foreground) / 0.6);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .radio.checked::after { content: ''; width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: hsl(var(--foreground)); }

  .seg { display: inline-flex; background: hsl(var(--muted)); border-radius: calc(var(--radius) - 2px); padding: 3px; gap: 2px; }
  .seg button {
    border: none; background: transparent; color: hsl(var(--muted-foreground));
    font: inherit; font-size: 0.875rem; font-weight: 500;
    padding: 0.2rem 0.7rem; border-radius: calc(var(--radius) - 4px); cursor: pointer;
  }
  .seg button.on { background: hsl(var(--background)); color: hsl(var(--foreground)); box-shadow: 0 1px 2px hsl(var(--overlay) / 0.1); }

  /* ---- admin dialog chrome (AdminPanelDialog replica) ---- */
  .backdrop {
    position: absolute; inset: 0; background: hsl(var(--overlay) / 0.8);
    display: flex; align-items: center; justify-content: center; padding: 1.25rem;
  }
  body.mobile .backdrop { padding: 0.5rem; }
  .admin-dialog {
    background: hsl(var(--background)); color: hsl(var(--foreground));
    border: 1px solid hsl(var(--border)); border-radius: var(--radius);
    box-shadow: 0 10px 40px hsl(var(--overlay) / 0.4);
    width: 100%; max-width: 900px; height: 92%;
    display: flex; flex-direction: column; overflow: hidden;
    padding: 1.5rem;
    gap: 0.9rem;
  }
  body.mobile .admin-dialog { padding: 1rem; height: 96%; }
  .admin-title { display: flex; align-items: center; gap: 0.5rem; font-size: 1.125rem; line-height: 1.75rem; font-weight: 600; flex-shrink: 0; }
  .admin-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 4px; }

  /* ---- events list bits ---- */
  .event-row {
    display: flex; align-items: center; gap: 0.75rem;
    border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 2px);
    background: hsl(var(--card)); color: hsl(var(--card-foreground));
    padding: 0.6rem 0.85rem; margin-bottom: 0.5rem;
  }
  .event-row.cancelled { opacity: 0.6; }
  .event-row .grow { flex: 1; min-width: 0; }
  .event-row .name { font-size: 0.875rem; font-weight: 600; line-height: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event-row .sub { font-size: 0.75rem; line-height: 1rem; color: hsl(var(--muted-foreground)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event-row .actions { display: flex; gap: 0.25rem; flex-shrink: 0; }
  body.mobile .event-row { flex-wrap: wrap; }
  body.mobile .event-row .actions { width: 100%; justify-content: flex-end; }

  .section-h {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.75rem; line-height: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    color: hsl(var(--muted-foreground));
    margin: 1.1rem 0 0.5rem;
  }
  .section-h:first-child { margin-top: 0; }

  .active-card {
    border: 1px solid hsl(var(--warning) / 0.5); border-radius: var(--radius);
    background: hsl(var(--warning) / 0.07);
    padding: 0.9rem 1rem; margin-bottom: 0.5rem;
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .active-card .toprow { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .active-card .stats { display: flex; gap: 1.1rem; font-size: 0.75rem; color: hsl(var(--muted-foreground)); flex-wrap: wrap; }
  .active-card .stats span { display: inline-flex; align-items: center; gap: 0.3rem; }

  /* master-detail (list C) */
  .md-wrap { display: flex; gap: 0.75rem; height: 100%; min-height: 0; }
  .md-list { width: 250px; flex-shrink: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 0.35rem; }
  body.mobile .md-wrap { flex-direction: column; }
  body.mobile .md-list { width: 100%; max-height: 38%; }
  .md-item {
    text-align: left; border: 1px solid transparent; background: transparent; color: inherit;
    font: inherit; border-radius: calc(var(--radius) - 2px);
    padding: 0.5rem 0.65rem; cursor: pointer;
    display: flex; flex-direction: column; gap: 0.15rem;
  }
  .md-item:hover { background: hsl(var(--accent)); }
  .md-item.sel { background: hsl(var(--card)); border-color: hsl(var(--border)); }
  .md-item .name { font-size: 0.875rem; font-weight: 600; line-height: 1.25rem; }
  .md-item.cancelled { opacity: 0.55; }
  .md-detail {
    flex: 1; min-width: 0; overflow-y: auto;
    border: 1px solid hsl(var(--border)); border-radius: var(--radius);
    background: hsl(var(--card)); padding: 1rem 1.1rem;
    display: flex; flex-direction: column; gap: 0.75rem;
  }
  .md-detail .kv { display: flex; flex-direction: column; gap: 0.2rem; }
  .md-detail .kv .k { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: hsl(var(--muted-foreground)); }
  .md-detail .kv .v { font-size: 0.875rem; line-height: 1.25rem; }

  /* ---- overlay dialogs (form / winner) ---- */
  .over {
    position: absolute; inset: 0; background: hsl(var(--overlay) / 0.55);
    display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 40;
  }
  .over-dialog {
    background: hsl(var(--background)); color: hsl(var(--foreground));
    border: 1px solid hsl(var(--border)); border-radius: var(--radius);
    box-shadow: 0 10px 40px hsl(var(--overlay) / 0.4);
    width: 100%; max-width: 560px; max-height: 94%;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .over-dialog.wide { max-width: 720px; }
  .over-head { padding: 1.25rem 1.5rem 0.75rem; flex-shrink: 0; }
  .over-body { padding: 0 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.85rem; }
  .over-foot { padding: 1rem 1.5rem 1.25rem; display: flex; justify-content: flex-end; gap: 0.5rem; flex-shrink: 0; }
  body.mobile .over-head, body.mobile .over-foot { padding-left: 1rem; padding-right: 1rem; }
  body.mobile .over-body { padding: 0 1rem; }

  .callout {
    border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 2px);
    background: hsl(var(--muted) / 0.5);
    padding: 0.6rem 0.8rem; font-size: 0.75rem; line-height: 1.1rem;
    color: hsl(var(--muted-foreground));
    display: flex; gap: 0.5rem; align-items: flex-start;
  }
  .callout svg { margin-top: 1px; }

  .bpreview {
    border: 1px dashed hsl(var(--info) / 0.6); border-radius: calc(var(--radius) - 2px);
    background: hsl(var(--info) / 0.06);
    padding: 0.7rem 0.85rem;
    display: flex; flex-direction: column; gap: 0.3rem;
  }
  .bpreview .from { font-size: 0.75rem; color: hsl(var(--muted-foreground)); display: flex; align-items: center; gap: 0.35rem; }
  .bpreview .subj { font-size: 0.875rem; font-weight: 600; }
  .bpreview .bod { font-size: 0.875rem; line-height: 1.3rem; color: hsl(var(--foreground) / 0.85); }

  /* split button (form C) */
  .split { display: inline-flex; position: relative; }
  .split .main { border-radius: calc(var(--radius) - 2px) 0 0 calc(var(--radius) - 2px); }
  .split .arrow { border-radius: 0 calc(var(--radius) - 2px) calc(var(--radius) - 2px) 0; border-left: 1px solid hsl(var(--primary-foreground) / 0.25); width: 2rem; padding: 0; }
  .split-menu {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 30;
    background: hsl(var(--popover)); color: hsl(var(--popover-foreground));
    border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 2px);
    box-shadow: 0 6px 24px hsl(var(--overlay) / 0.25);
    display: flex; flex-direction: column; padding: 4px; min-width: 190px;
  }
  .split-menu button {
    display: flex; align-items: center; gap: 0.5rem; text-align: left;
    border: none; background: transparent; color: inherit; font: inherit; font-size: 0.875rem;
    padding: 0.4rem 0.6rem; border-radius: calc(var(--radius) - 4px); cursor: pointer;
  }
  .split-menu button:hover { background: hsl(var(--accent)); }

  /* ---- winner pick bits ---- */
  .entry-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  body.mobile .entry-grid { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .entry-card {
    border: 1px solid hsl(var(--border)); border-radius: var(--radius);
    background: hsl(var(--card)); color: hsl(var(--card-foreground));
    overflow: hidden; display: flex; flex-direction: column; position: relative;
    cursor: pointer; text-align: left; font: inherit; padding: 0;
  }
  .entry-card:hover { border-color: hsl(var(--foreground) / 0.35); }
  .entry-card.sel { outline: 2px solid hsl(var(--warning)); outline-offset: 1px; }
  .entry-card.blocked { cursor: not-allowed; opacity: 0.65; }
  .entry-card.blocked:hover { border-color: hsl(var(--border)); }
  .entry-thumb { height: 4.6rem; display: flex; align-items: flex-end; color: white; }
  .entry-thumb .name {
    width: 100%; padding: 0.3rem 0.5rem;
    background: hsl(var(--overlay) / 0.5);
    font-size: 0.75rem; font-weight: 600; line-height: 1rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .entry-body { padding: 0.4rem 0.5rem; display: flex; flex-direction: column; gap: 0.25rem; }
  .entry-meta { display: flex; gap: 0.7rem; font-size: 0.7rem; color: hsl(var(--muted-foreground)); }
  .entry-meta span { display: inline-flex; align-items: center; gap: 0.2rem; }
  .blocked-tag {
    position: absolute; top: 0.35rem; right: 0.35rem; z-index: 2;
    background: hsl(var(--background) / 0.9); color: hsl(var(--muted-foreground));
    border: 1px solid hsl(var(--border));
    border-radius: 9999px; padding: 0.05rem 0.5rem; font-size: 0.65rem; font-weight: 600;
  }

  .jt { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  .jt th {
    text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: hsl(var(--muted-foreground)); font-weight: 600;
    padding: 0.35rem 0.6rem; border-bottom: 1px solid hsl(var(--border));
    white-space: nowrap;
  }
  .jt td { padding: 0.45rem 0.6rem; border-bottom: 1px solid hsl(var(--border) / 0.6); white-space: nowrap; }
  .jt td.grow { white-space: normal; }
  .jt tr.blocked td { opacity: 0.55; }
  .jt tr.sel td { background: hsl(var(--warning) / 0.1); }
  .jt .num { text-align: right; color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }

  .wizard-steps { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: hsl(var(--muted-foreground)); }
  .wizard-steps .step { display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 600; }
  .wizard-steps .step .dot {
    width: 1.15rem; height: 1.15rem; border-radius: 9999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: hsl(var(--muted)); font-size: 0.7rem;
  }
  .wizard-steps .step.on { color: hsl(var(--foreground)); }
  .wizard-steps .step.on .dot { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }

  .winner-hero {
    display: flex; align-items: center; gap: 0.85rem;
    border: 1px solid hsl(var(--warning) / 0.5); border-radius: var(--radius);
    background: hsl(var(--warning) / 0.08); padding: 0.8rem 1rem;
  }
  .winner-hero .thumbmini { width: 3.4rem; height: 3.4rem; border-radius: calc(var(--radius) - 2px); flex-shrink: 0; }

  /* ---- prototype control bar (deliberately not app-styled) ---- */
  #protoBar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 100;
    background: #16161d; color: #f4f4f6;
    border: 1px solid #3a3a46; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    font-size: 12px; max-width: min(96vw, 980px);
  }
  #protoBar .group { display: flex; align-items: center; gap: 4px; }
  #protoBar .sep { width: 1px; height: 22px; background: #3a3a46; }
  #protoBar button {
    background: transparent; color: #c9c9d4; border: 1px solid transparent;
    border-radius: 8px; padding: 4px 9px; font: inherit; cursor: pointer; white-space: nowrap;
  }
  #protoBar button:hover { background: #26262f; }
  #protoBar button.on { background: #f4f4f6; color: #16161d; font-weight: 600; }
  #protoBar .variant-label { min-width: 190px; text-align: center; font-weight: 600; color: #f4f4f6; }
</style>
<script>
  document.documentElement.classList.toggle('dark',
    window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
</script>

<div id="frameWrap"><div id="app"></div></div>
<div id="protoBar"></div>

<script>
(function () {
  'use strict';

  /* ---------- icons (lucide) ---------- */
  function ic(name, size, cls) {

    '</div>';
  }

  function pickedView(closeLabel) {
    var e = ENTRIES[state.winSel === null ? 0 : state.winSel];
    return '<div style="display:flex; flex-direction:column; gap:0.85rem; padding: 0.5rem 0 1rem;">' +
      '<div class="winner-hero">' +
        '<div class="thumbmini" style="background:linear-gradient(160deg,hsl(' + HUES[state.winSel % HUES.length] + ' 45% 45%),hsl(' + (HUES[state.winSel % HUES.length] + 40) + ' 55% 25%))"></div>' +
        '<div style="flex:1; min-width:0;">' +
          '<div class="t-label fw-semi" style="display:flex; align-items:center; gap:0.4rem;">' + ic('trophy', 14) + e[0] + '</div>' +
          '<div class="t-meta muted">by ' + e[1] + ' · winner recorded · announcement sent</div>' +
        '</div>' +
      '</div>' +
      '<p class="t-meta muted">The contest is now archived: the banner is gone, entries unlocked, and the winner wears its badge in Community Creations.</p>' +
      '<div><button class="btn btn-sm btn-outline" data-act="resetPick">' + ic('back', 13) + closeLabel + '</button></div>' +
    '</div>';
  }

  function winnerA() {
    if (state.picked) return adminChrome('events', pickedView('Reset Demo'));
    var sel = state.winSel;
    var cards = ENTRIES.map(function (e, i) {
      var blocked = !!e[5];
      return '<button class="entry-card' + (blocked ? ' blocked' : '') + (sel === i && !blocked ? ' sel' : '') + '"' +
        (blocked ? '' : ' data-pick="' + i + '"') + '>' +
        (blocked ? '<span class="blocked-tag">' + e[5] + '</span>' : '') +
        '<div class="entry-thumb" style="background:linear-gradient(160deg,hsl(' + HUES[i % HUES.length] + ' 45% 45%),hsl(' + (HUES[i % HUES.length] + 40) + ' 55% 25%))">' +
          '<div class="name">' + e[0] + '</div></div>' +
        '<div class="entry-body">' +
          '<div class="t-meta muted">by ' + e[1] + '</div>' +
          '<div class="entry-meta"><span>' + ic('heart', 11) + e[2] + '</span><span>' + ic('download', 11) + e[3] + '</span><span>' + ic('comment', 11) + e[4] + '</span></div>' +
        '</div></button>';
    }).join('');
    var dialog =
      '<div class="over"><div class="over-dialog wide">' +
        '<div class="over-head"><div class="t-title fw-semi" style="display:flex; align-items:center; gap:0.5rem;">' + ic('trophy', 16) + 'Pick Winner — Summer Isles</div>' +
          '<p class="t-meta muted" style="margin-top:2px;">12 entries. Your own entry and quarantined worlds can’t be picked.</p></div>' +
        '<div class="over-body">' +
          '<div class="entry-grid">' + cards + '</div>' +
          (sel !== null ? bPreview(ENTRIES[sel][0], ENTRIES[sel][1]) : '') +
        '</div>' +
        '<div class="over-foot">' +
          '<button class="btn btn-outline">Cancel</button>' +
          '<button class="btn btn-primary" ' + (sel === null ? 'disabled' : 'data-act="confirmPick"') + '>' + ic('trophy', 14) + 'Announce Winner</button>' +
        '</div>' +
      '</div></div>';
    return adminChrome('events', '<p class="t-label muted" style="padding-top:1rem;">' + listHelper() + '</p>') + dialog;
  }

  function winnerB() {
    if (state.picked) return adminChrome('events', pickedView('Reset Demo'));
    var sel = state.winSel;
    var steps =
      '<div class="wizard-steps">' +
        '<span class="step' + (state.winStep === 1 ? ' on' : '') + '"><span class="dot">1</span>Choose Entry</span>' +
        ic('chevD', 12, '') +
        '<span class="step' + (state.winStep === 2 ? ' on' : '') + '"><span class="dot">2</span>Review &amp; Announce</span>' +
      '</div>';
    var body, foot;
    if (state.winStep === 1) {
      var rows = ENTRIES.map(function (e, i) {
        var blocked = !!e[5];
        return '<tr class="' + (blocked ? 'blocked' : '') + (sel === i && !blocked ? ' sel' : '') + '"' + (blocked ? '' : ' data-pick="' + i + '" style="cursor:pointer;"') + '>' +
          '<td><span class="radio' + (sel === i && !blocked ? ' checked' : '') + '"></span></td>' +
          '<td class="grow"><span class="fw-med">' + e[0] + '</span>' + (blocked ? ' <span class="t-meta muted">— ' + e[5] + '</span>' : '') + '</td>' +
          '<td>' + e[1] + '</td>' +
          '<td class="num">' + e[2] + '</td><td class="num">' + e[3] + '</td><td class="num">' + e[4] + '</td>' +
        '</tr>';
      }).join('');
      body = '<table class="jt"><thead><tr><th></th><th>Entry</th><th>Author</th><th>♥</th><th>⤓</th><th>💬</th></tr></thead><tbody>' + rows + '</tbody></table>';
      foot = '<button class="btn btn-outline">Cancel</button>' +
        '<button class="btn btn-primary" ' + (sel === null ? 'disabled' : 'data-act="wizNext"') + '>Next</button>';
    } else {
      var e = ENTRIES[sel];
      body =
        '<div class="winner-hero">' +
          '<div class="thumbmini" style="background:linear-gradient(160deg,hsl(' + HUES[sel % HUES.length] + ' 45% 45%),hsl(' + (HUES[sel % HUES.length] + 40) + ' 55% 25%))"></div>' +
          '<div style="flex:1; min-width:0;">' +
            '<div class="t-label fw-semi">' + e[0] + '</div>' +
            '<div class="t-meta muted">by ' + e[1] + ' · ' + e[2] + ' likes · ' + e[3] + ' downloads</div>' +
          '</div>' +
        '</div>' + bPreview(e[0], e[1]) +
        '<div class="callout">' + ic('alert', 13) + '<span>This announces to everyone and can’t be re-picked. The record survives even if the world is later deleted.</span></div>';
      foot = '<button class="btn btn-outline" data-act="wizBack">' + ic('chevL', 13) + 'Back</button>' +
        '<button class="btn btn-primary" data-act="confirmPick">' + ic('trophy', 14) + 'Announce Winner</button>';
    }
    var dialog =
      '<div class="over"><div class="over-dialog wide">' +
        '<div class="over-head"><div class="t-title fw-semi" style="display:flex; align-items:center; gap:0.5rem;">' + ic('trophy', 16) + 'Pick Winner — Summer Isles</div>' +
          '<div style="margin-top:0.5rem;">' + steps + '</div></div>' +
        '<div class="over-body">' + body + '</div>' +
        '<div class="over-foot">' + foot + '</div>' +
      '</div></div>';
    return adminChrome('events', '<p class="t-label muted" style="padding-top:1rem;">' + listHelper() + '</p>') + dialog;
  }

  function winnerC() {
    if (state.picked) return adminChrome('events', pickedView('Reset Demo'));
    var sel = state.winSel;
    var rows = ENTRIES.map(function (e, i) {
      var blocked = !!e[5];
      return '<tr class="' + (blocked ? 'blocked' : '') + '">' +
        '<td class="grow"><span class="fw-med">' + e[0] + '</span>' + (blocked ? ' <span class="t-meta muted">— ' + e[5] + '</span>' : '') + '</td>' +
        '<td>' + e[1] + '</td>' +
        '<td class="num">' + e[2] + '</td><td class="num">' + e[3] + '</td>' +
        '<td>' + (blocked ? '' : '<button class="btn btn-xs btn-outline" data-pickc="' + i + '">' + ic('trophy', 11) + 'Pick</button>') + '</td>' +
      '</tr>';
    }).join('');
    var confirm = '';
    if (state.confirmOpen && sel !== null) {
      var e = ENTRIES[sel];
      confirm =
        '<div class="over"><div class="over-dialog">' +
          '<div class="over-head"><div class="t-title fw-semi">Announce “' + e[0] + '” as Winner?</div></div>' +
          '<div class="over-body">' + bPreview(e[0], e[1]) + '</div>' +
          '<div class="over-foot">' +
            '<button class="btn btn-outline" data-act="closeConfirm">Cancel</button>' +
            '<button class="btn btn-primary" data-act="confirmPick">' + ic('trophy', 14) + 'Announce Winner</button>' +
          '</div>' +
        '</div></div>';
    }
    return adminChrome('events',
      '<div style="padding-top:1rem; display:flex; flex-direction:column; gap:0.75rem;">' +
        '<div class="active-card">' +
          '<div class="toprow">' +
            '<span class="t-label fw-semi" style="flex:1; min-width:10rem;">Summer Isles Worldbuilding Contest</span>' +
            typeBadge('contest') + badge('judging') +
          '</div>' +
          '<div class="stats"><span>' + ic('clock', 12) + 'Ended Sep 1</span><span>' + ic('users', 12) + '12 entries, sorted by likes</span></div>' +
        '</div>' +
        '<table class="jt"><thead><tr><th>Entry</th><th>Author</th><th>♥</th><th>⤓</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>') + confirm;
  }

  /* ---------- proto bar ---------- */
  function protoBar() {
    var bar = document.getElementById('protoBar');
    var screenBtns = SCREENS.map(function (s) {
      return '<button data-screen="' + s[0] + '" class="' + (state.screen === s[0] ? 'on' : '') + '">' + s[1] + '</button>';
    }).join('');
    var v = state.variant[state.screen];
    var sub = '';
    if (state.screen !== 'form') {
      sub = '<div class="sep"></div><div class="group">' +
        ['admin', 'staff'].map(function (r) {
          return '<button data-role="' + r + '" class="' + (state.role === r ? 'on' : '') + '">' + r + '</button>';
        }).join('') + '</div>';
    }
    bar.innerHTML =
      '<div class="group">' + screenBtns + '</div>' +
      '<div class="sep"></div>' +
      '<div class="group">' +
        '<button data-cycle="-1" aria-label="Previous variant">←</button>' +
        '<span class="variant-label">' + v + ' — ' + VARIANT_NAMES[state.screen][v] + '</span>' +
        '<button data-cycle="1" aria-label="Next variant">→</button>' +
      '</div>' + sub +
      '<div class="sep"></div>' +
      '<div class="group">' +
        '<button data-toggle="theme">' + (document.documentElement.classList.contains('dark') ? 'Light' : 'Dark') + '</button>' +
        '<button data-toggle="mobile" class="' + (document.body.classList.contains('mobile') ? 'on' : '') + '">Mobile</button>' +
      '</div>';
  }

  /* ---------- render + events ---------- */
  function render() {
    var app = document.getElementById('app');
    var v = state.variant[state.screen];
    if (state.screen === 'list') app.innerHTML = v === 'A' ? listA() : v === 'B' ? listB() : listC();
    else if (state.screen === 'form') app.innerHTML = v === 'A' ? formA() : v === 'B' ? formB() : formC();
    else app.innerHTML = v === 'A' ? winnerA() : v === 'B' ? winnerB() : winnerC();
    protoBar();
  }

  document.getElementById('protoBar').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.screen) state.screen = b.dataset.screen;
    else if (b.dataset.cycle) {
      var keys = ['A', 'B', 'C'];
      var cur = keys.indexOf(state.variant[state.screen]);
      state.variant[state.screen] = keys[(cur + Number(b.dataset.cycle) + 3) % 3];
    }
    else if (b.dataset.role) state.role = b.dataset.role;
    else if (b.dataset.toggle === 'theme') document.documentElement.classList.toggle('dark');
    else if (b.dataset.toggle === 'mobile') document.body.classList.toggle('mobile');
    render();
  });

  document.getElementById('app').addEventListener('click', function (ev) {
    var pick = ev.target.closest('[data-pick]');
    if (pick) { state.winSel = Number(pick.dataset.pick); render(); return; }
    var pickc = ev.target.closest('[data-pickc]');
    if (pickc) { state.winSel = Number(pickc.dataset.pickc); state.confirmOpen = true; render(); return; }
    var md = ev.target.closest('[data-md]');
    if (md) { state.mdSel = md.dataset.md; render(); return; }
    var el = ev.target.closest('[data-act]');
    if (!el) { if (state.splitOpen) { state.splitOpen = false; render(); } return; }
    var act = el.dataset.act;
    if (act === 'goWinner') { state.screen = 'winner'; }
    else if (act === 'goForm') { state.screen = 'form'; state.splitOpen = false; }
    else if (act === 'splitToggle') { state.splitOpen = !state.splitOpen; }
    else if (act === 'ftype') { state.formType = el.dataset.v; }
    else if (act === 'composerEvent') { state.composerEvent = !state.composerEvent; }
    else if (act === 'wizNext') { state.winStep = 2; }
    else if (act === 'wizBack') { state.winStep = 1; }
    else if (act === 'confirmPick') { state.picked = true; state.confirmOpen = false; }
    else if (act === 'closeConfirm') { state.confirmOpen = false; }
    else if (act === 'resetPick') { state.picked = false; state.winSel = null; state.winStep = 1; state.confirmOpen = false; state.screen = 'list'; }
    render();
  });

  document.addEventListener('keydown', function (ev) {
    if (/INPUT|TEXTAREA/.test(ev.target.tagName) || ev.target.isContentEditable) return;
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
      var keys = ['A', 'B', 'C'];
      var cur = keys.indexOf(state.variant[state.screen]);
      state.variant[state.screen] = keys[(cur + (ev.key === 'ArrowRight' ? 1 : -1) + 3) % 3];
      render();
    }
  });

  render();
})();
</script>
