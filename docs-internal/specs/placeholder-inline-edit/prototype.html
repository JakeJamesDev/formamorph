<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<title>PROTOTYPE — Inline Placeholder Expansion</title>
<link rel="stylesheet" href="/src/index.css">
<style>
  body { padding: 28px; max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h1 .tag { color: hsl(var(--destructive)); font-size: 12px; border: 1px solid hsl(var(--destructive)); border-radius: 4px; padding: 1px 6px; vertical-align: middle; margin-left: 8px; }
  .question { color: hsl(var(--muted-foreground)); max-width: 980px; margin-bottom: 16px; }
  .question b { color: hsl(var(--foreground)); }
  .options { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; color: hsl(var(--muted-foreground)); }
  .options select { margin-left: 6px; background: hsl(var(--background)); color: hsl(var(--foreground)); border: 1px solid hsl(var(--border)); border-radius: 4px; padding: 2px 4px; }
  .options .reset { margin-left: auto; border: 1px solid hsl(var(--border)); border-radius: 6px; padding: 4px 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { background: hsl(var(--card)); color: hsl(var(--muted-foreground)); border: 1px solid hsl(var(--border)); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 12px; }
  .tabs button.active { color: hsl(var(--foreground)); border-color: hsl(var(--primary)); }
  .scenario { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
  .scenario p { color: hsl(var(--muted-foreground)); margin-bottom: 8px; font-size: 13px; }
  .scenario button { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border: 0; border-radius: 6px; padding: 6px 14px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; margin-right: 6px; }
  .scenario button:disabled { opacity: .4; cursor: default; }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .field-label { font-size: 12px; color: hsl(var(--muted-foreground)); margin-bottom: 4px; }
  .editor { width: 100%; border: 1px solid hsl(var(--input)); background: hsl(var(--background)); border-radius: 6px; padding: 8px 12px; outline: none; white-space: pre-wrap; line-height: 1.9; }
  .editor-prose { min-height: 120px; }
  .editor-line { min-height: 0; padding: 4px 12px; }
  .editor:focus { box-shadow: inset 0 0 0 2px hsl(var(--ring)); }

  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 0 6px; font-size: 12px; font-weight: 600; color: #000; line-height: 1.5; cursor: pointer; vertical-align: baseline; user-select: none; }
  .chip-x { display: inline-flex; opacity: .6; } .chip-x:hover { opacity: 1; }

  /* The region: an inline element wrapping editable text. The header is its first (non-editable) child. */
  .region-head-slot { display: inline-block; user-select: none; }
  .region-head { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: #000; background: var(--accent); border-radius: 5px; padding: 0 4px; margin-right: 6px; line-height: 1.5; vertical-align: baseline; }
  .region-head button { display: inline-flex; padding: 1px; border-radius: 3px; } .region-head button:hover { background: rgba(0,0,0,.15); } .region-head button:disabled { opacity: .35; }
  .region-slot { font-weight: 400; opacity: .75; margin: 0 2px; }

  /* Treatment A — a tinted box that follows the wrapped lines. */
  .region-boxed { background: color-mix(in oklab, var(--accent) 14%, transparent); box-shadow: 0 0 0 1px color-mix(in oklab, var(--accent) 45%, transparent); border-radius: 6px; padding: 2px 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  /* Treatment B — the region takes its own line(s), block inside an inline flow. */
  .region-ownline { display: block; margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--accent); background: hsl(var(--card)); border-radius: 0 6px 6px 0; }
  /* Treatment C — the lightest touch: an underline and the header only. */
  .region-underline { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }

  /* Treatment D — the chip stays a decorator and opens a Lexical named slot, mounted into its chrome. */
  .chip-host { display: inline; }
  .slot-chrome { display: inline; background: color-mix(in oklab, var(--accent) 14%, transparent); box-shadow: 0 0 0 1px color-mix(in oklab, var(--accent) 45%, transparent); border-radius: 6px; padding: 2px 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .slot-target, .slot-target [data-lexical-slot], .slot-target [data-lexical-slot] > p, .slot-target .slot-box, .slot-target .slot-box > p { display: inline; }
  .slot-target [data-lexical-slot] { outline: none; }
  .slot-target .slot-box > p + p::before { content: '↵ '; opacity: .4; }

  /* Treatment G — the value stays inline exactly where the chip was; only the header lifts above the start
     of the value, and a zero-width tall spacer makes the line box grow upward so the header has room and
     the line above is pushed away, never covered. */
  .slot-chrome-slot-float { position: relative; }
  .slot-chrome-slot-float::before { content: ''; display: inline-block; width: 0; height: 2.55em; vertical-align: baseline; }
  .slot-chrome-slot-float > .region-head { position: absolute; left: -1px; top: -1.35em; margin: 0; white-space: nowrap; border-radius: 5px 5px 5px 0; }

  /* Treatment E — header above the value, the whole thing an inline block in the text flow. It stays on the
     line where the chip was and wraps inside itself, never mid-line around the neighbors. */
  .slot-chrome-slot-stack { display: inline-flex; flex-direction: column; align-items: flex-start; vertical-align: top; max-width: 100%; padding: 0 0 4px; margin: 2px 2px; border-radius: 6px; box-decoration-break: slice; }
  .slot-chrome-slot-stack > .region-head { margin: 0; border-radius: 5px 5px 0 0; align-self: stretch; padding: 1px 6px; }
  .slot-chrome-slot-stack > .slot-target { display: block; padding: 3px 6px 0; line-height: 1.5; }
  .slot-chrome-slot-stack > .slot-target [data-lexical-slot], .slot-chrome-slot-stack > .slot-target [data-lexical-slot] > p,
  .slot-chrome-slot-stack > .slot-target .slot-box, .slot-chrome-slot-stack > .slot-target .slot-box > p { display: block; }
  .slot-chrome-slot-stack > .slot-target .slot-box > p + p::before { content: none; }
  /* Treatment F — header above the value, on its own lines: the text before and after breaks around it. */
  .slot-chrome-slot-block { display: block; margin: 6px 0; padding: 0 0 6px; border-radius: 6px; box-decoration-break: slice; }
  .slot-chrome-slot-block > .region-head { display: flex; margin: 0; border-radius: 5px 5px 0 0; padding: 1px 8px; }
  .slot-chrome-slot-block > .slot-target { display: block; padding: 4px 10px 0; line-height: 1.6; }
  .slot-chrome-slot-block > .slot-target [data-lexical-slot], .slot-chrome-slot-block > .slot-target [data-lexical-slot] > p,
  .slot-chrome-slot-block > .slot-target .slot-box, .slot-chrome-slot-block > .slot-target .slot-box > p { display: block; }
  .slot-chrome-slot-block > .slot-target .slot-box > p + p::before { content: none; }

  .panel { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 8px; padding: 12px 14px; }
  .panel-title { font-size: 12px; color: hsl(var(--muted-foreground)); margin-bottom: 8px; }
  .ph { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .slot { display: inline-flex; flex-direction: column; font-size: 11px; color: hsl(var(--muted-foreground)); }
  .slot input { background: hsl(var(--background)); color: hsl(var(--foreground)); border: 1px solid hsl(var(--border)); border-radius: 4px; padding: 2px 6px; font-size: 12px; width: 190px; }
  .stored { display: grid; grid-template-columns: 90px 1fr; gap: 8px; font-size: 12px; margin-bottom: 6px; }
  .stored code { white-space: pre-wrap; word-break: break-word; color: hsl(var(--foreground)); }
  .log { font-size: 12px; color: hsl(var(--muted-foreground)); list-style: none; }
  .log li:first-child { color: hsl(var(--foreground)); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./prototype.tsx"></script>
</body>
</html>
