<!doctype html>
<!--
  Copy page for the itch.io description. Open thumbnails/itch-page/paste.html in a browser, press
  Copy, and paste into itch's description editor. itch keeps inline centering and hosted images but
  drops local ones, so the copy marks each local image as an upload to place by hand.
-->
<html lang="en"><head><meta charset="utf-8"><title>Itch Description Copy</title>
<style>
  body { background:#111318; color:#e8eaed; font:16px/1.5 Lato, sans-serif; max-width:760px; margin:24px auto; padding:0 16px; }
  a { color:#c4b5fd; } .text-center { text-align:center; } li { margin:.35em 0; }
  .bar { position:sticky; top:0; background:#111318; padding:10px 0; border-bottom:1px solid #2a2e35; display:flex; gap:12px; align-items:center; }
  button { background:#a78bfa; color:#1a1025; border:0; border-radius:4px; padding:8px 14px; font-weight:700; cursor:pointer; }
  #desc { border:1px dashed #3a3f47; padding:8px 24px; margin-top:16px; }
</style></head><body>
<div class="bar"><button id="copy">Copy</button><span id="msg">Preview below. Local images become upload markers in the copy.</span></div>
<div id="desc"><!-- DESCRIPTION --></div>
<script>
  const desc = document.getElementById('desc');
  const msg = document.getElementById('msg');
  document.getElementById('copy').onclick = async () => {
    const copy = desc.cloneNode(true);
    copy.querySelectorAll('.text-center').forEach((el) => { el.style.textAlign = 'center'; });
    const uploads = [];
    copy.querySelectorAll('img').forEach((img) => {
      const src = img.getAttribute('src');
      if (/^https?:/.test(src)) return;
      const link = img.closest('a');
      const mark = document.createElement('mark');
      mark.textContent = link ? `[upload ${src}, link to ${link.href}]` : `[upload ${src}]`;
      (link ?? img).replaceWith(mark);
      uploads.push(src);
    });
    const html = copy.innerHTML;
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([copy.innerText], { type: 'text/plain' }),
    })]);
    msg.textContent = `Copied. Upload by hand: ${uploads.join(', ')}`;
  };
</script>
</body></html>
