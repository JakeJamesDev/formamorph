name: CI

on:
  # Branches only: a release tag runs these checks through release.yml.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # The suite is CPU-bound and a hosted runner has 4 vCPUs, so it runs as parallel shards.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # The pre-refresh and pre-expansion bundled worlds (src/test/bundledRevisions.ts) and SHIPPED_SINCE (scripts/bundledRevisions.ts).
      - run: git fetch --depth=1 origin ace2e02040d6e94e0367beae64e72bc0aa65bdef 2f45261a55abe56fc50148c08097301b57d8b05c cd6fe508c480fa5921f48dd65befc892ac73fb4b
      - run: npx vitest run --shard=${{ matrix.shard }}/4
