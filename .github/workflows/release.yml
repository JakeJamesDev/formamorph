name: Release

# Build release artifacts for every tagged release. Each desktop runner packages for its own OS
# (electron-builder can't reliably cross-build AppImage from Windows), so the matrix produces the Windows
# launcher distributable, Linux AppImage, and macOS .dmg from one tag. A separate `web` job zips the browser
# build. Everything is attached to the one GitHub Release for the tag.
#
# INVARIANT: the tag must equal `v<package.json version>`. The app bakes package.json's version as its
# APP_VERSION and every artifact is named from it, and electron-builder publishes the Linux AppImage +
# latest-linux.yml to the release for that same version — so a tag that disagrees would split the build
# across two releases and ship an app whose self-reported version doesn't match its tag. The guard below
# fails fast on a mismatch. To release: bump package.json, commit, then tag `v<version>`.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      itch_web:
        description: 'Push the web build to itch.io (manual failsafe, e.g. for a pre-release)'
        type: boolean
        default: false
      itch_desktop:
        description: 'Push desktop builds to itch.io'
        type: boolean
        default: false
      cloudflare_web:
        description: 'Push the web build to formamorph.ai (manual failsafe, e.g. for a pre-release)'
        type: boolean
        default: false
      site_only:
        description: 'Redeploy formamorph.ai from hosting/ alone, keeping the latest RELEASED app build'
        type: boolean
        default: false

jobs:
  build:
    # A site-only redeploy ships no app code, so nothing is built and nothing is published. `publish`
    # needs this job, so skipping here skips that too.
    if: ${{ !inputs.site_only }}
    strategy:
      fail-fast: false
      matrix:
        # `build` is the portability class baked into the app (FORMAMORPH_BUILD → footer tag). The Windows
        # portable .exe and the Linux AppImage are both relocatable → 'portable'; the mac .dmg installs → 'installed'.
        include:
          - os: windows-latest
            script: desktop:build
            build: portable
          - os: ubuntu-latest
            # electron-updater's AppImage self-update needs latest-linux.yml in the release, which is only
            # produced when publishing — so Linux publishes directly (a draft the `publish` job finalizes).
            script: desktop:build:linux:publish
            build: portable
          - os: macos-latest
            script: desktop:build:mac
            build: installed
    runs-on: ${{ matrix.os }}
    # contents: write lets the Linux electron-builder step publish its AppImage + latest-linux.yml draft.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must equal 'v<package.json version>' ('$PKG'). Bump package.json, commit, then tag."
            exit 1
          fi
      - run: npm ci
      # Releases ship the alternate avatar. The tracked default stays on the Pages dev build and local dev.
      - name: Swap in the release avatar
        shell: bash
        run: cp build-assets/alternate-avatar.vrm public/default-avatar.vrm
      - run: npm run ${{ matrix.script }}
        env:
          FORMAMORPH_BUILD: ${{ matrix.build }}
          # Only the Linux --publish step consumes this; the Windows/mac --publish never scripts ignore it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Windows: build the Go launcher, then assemble the distributable — launcher at the clean root + the
      # electron `dir` payload under app/. Produces the full-root zip (first-time download) plus the app
      # payload zip + its sha512 (the update unit the running app downloads and the launcher swaps in).
      - if: matrix.os == 'windows-latest'
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - if: matrix.os == 'windows-latest'
        name: Assemble Windows launcher distributable
        shell: bash
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          mkdir -p release/root/app
          # Embed the shared app icon (public/icon.png) into the stub as a Windows resource so it shows the same
          # icon as the app in Explorer/taskbar. go-winres generates the *.syso that `go build` links in.
          # -H=windowsgui puts the stub on the GUI subsystem so Windows never flashes a console window on launch.
          # No -s -w: symbol-stripped Go binaries trip Defender's Wacatac ML detection (A/B verified on VirusTotal).
          (cd launcher \
            && go run github.com/tc-hib/go-winres@v0.3.3 simply --icon ../public/icon.png \
            && go build -trimpath -ldflags "-H=windowsgui" -o "../release/root/Formamorph.exe" . \
            && rm -f rsrc_windows_*.syso)
          cp -r release/win-unpacked/* release/root/app/
          (cd release/root && 7z a -tzip "../Formamorph-${VER}-win.zip" . >/dev/null)
          (cd release/win-unpacked && 7z a -tzip "../app-${VER}-win.zip" . >/dev/null)
          (cd release && sha512sum "app-${VER}-win.zip" | cut -d' ' -f1 > "app-${VER}-win.zip.sha512")
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.dmg
            release/*-win.zip
            release/*-win.zip.sha512
          if-no-files-found: error

  web:
    # Skipped on a site-only redeploy, which serves the already-released build instead.
    if: ${{ !inputs.site_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # Releases ship the alternate avatar. The tracked default stays on the Pages dev build and local dev.
      - name: Swap in the release avatar
        run: cp build-assets/alternate-avatar.vrm public/default-avatar.vrm
      # No env overrides → full build (community on, full tag data), unlike the Pages demo build.
      # FORMAMORPH_BUILD=web keeps the footer bare (no build tag) for the browser build.
      - run: npm run build
        env:
          FORMAMORPH_BUILD: web
      # Zip from inside dist so index.html sits at the zip root (itch.io requires this to serve it). Named
      # from package.json version (== the tag, per the guard) so every artifact shares one version string.
      - name: Zip web build
        run: |
          VER=$(node -p "require('./package.json').version")
          cd dist && zip -r "../formamorph-web-${VER}.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: formamorph-web-*.zip
          if-no-files-found: error

  publish:
    needs: [build, web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # Generate the release body from the changelog's collapsed section for THIS tag's version (user-facing
      # one-liners), so the release publishes WITH its notes — no manual editing, and no window where an update
      # is live but blank. Keyed to the tagged version (`v2.2.0` → `--release 2.2.0`), so finalizing the
      # changelog into its "✅ Released" block is the correct last step *before* tagging — order-independent,
      # unlike the old "In Progress" read which broke if the section was collapsed first.
      - run: node scripts/extractReleaseNotes.mjs --release "${GITHUB_REF_NAME#v}" > notes.md
      # The Linux build already published the AppImage + latest-linux.yml to this tag's release as a draft
      # (electron-builder targets `v<package.json version>`, which the guard forces to equal the tag). This
      # step attaches the Windows/mac/web artifacts to that SAME release, sets the notes, and publishes it.
      # AppImage is intentionally omitted — electron-builder already uploaded it (and its update metadata).
      - uses: softprops/action-gh-release@v3
        with:
          # Any suffixed tag (v2.16.0-beta etc.) publishes as a pre-release; itch jobs below skip those.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: |
            artifacts/*.dmg
            artifacts/*-win.zip
            artifacts/*-win.zip.sha512
            artifacts/formamorph-web-*.zip

  # itch.io deployment via butler. Butler updates by CHANNEL, not filename: every push to a visible
  # channel replaces the live build immediately. Full-release tags (no suffix) deploy automatically;
  # pre-release tags (-beta) never do — push those by hand via workflow_dispatch on the tag's ref.
  # Needs the BUTLER_API_KEY secret (itch.io → Settings → API keys, from an account with access to
  # fierylion/formamorph). Versions are parsed from artifact filenames so they always match the build.
  itch-web:
    needs: web
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && !contains(github.ref_name, '-'))
      || (github.event_name == 'workflow_dispatch' && inputs.itch_web)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
      - uses: remarkablegames/setup-butler@v3
      - name: Push web build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          ZIP=$(ls formamorph-web-*.zip)
          VER=${ZIP#formamorph-web-}; VER=${VER%.zip}
          unzip -q "$ZIP" -d web
          butler push web fierylion/formamorph:html5 --userversion "$VER"

  # Desktop goes to itch only on major/minor releases (tag ends in .0), never on patches.
  itch-desktop:
    needs: build
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && !contains(github.ref_name, '-') && endsWith(github.ref_name, '.0'))
      || (github.event_name == 'workflow_dispatch' && inputs.itch_desktop)
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
      - uses: remarkablegames/setup-butler@v3
      - name: Push desktop builds to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          WINZIP=$(ls Formamorph-*-win.zip)
          VER=${WINZIP#Formamorph-}; VER=${VER%-win.zip}
          # Windows ships unzipped (launcher at root) so butler can diff files between pushes.
          unzip -q "$WINZIP" -d win
          butler push win fierylion/formamorph:windows --userversion "$VER"
          butler push "$(ls *.AppImage)" fierylion/formamorph:linux --userversion "$VER"
          butler push "$(ls *.dmg)" fierylion/formamorph:mac --userversion "$VER"

  # Cloudflare Pages deploy → https://formamorph.ai. The upload root is `out/`: the app build unpacked
  # into out/play/, plus everything tracked in hosting/ at the root — the landing page, its images, and
  # the Pages config. Both deploy paths below hand that same assemble-guard-deploy-check sequence a
  # different app build. Needs the CLOUDFLARE_API_TOKEN (Pages Edit scope) and CLOUDFLARE_ACCOUNT_ID
  # secrets.
  #
  # Release path: same gate as itch-web — full-release tags deploy automatically, suffixed tags never do
  # (push one by hand via workflow_dispatch on the tag's ref). Ships the build this run just made.
  cloudflare-web:
    needs: web
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && !contains(github.ref_name, '-'))
      || (github.event_name == 'workflow_dispatch' && inputs.cloudflare_web)
    steps:
      # Checked out for hosting/ and the shared action — every /play/ byte comes from the web artifact.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web-zip
      - id: zip
        run: echo "path=$(ls web-zip/formamorph-web-*.zip)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/deploy-site
        with:
          web-zip: ${{ steps.zip.outputs.path }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          run-checks: ${{ vars.CLOUDFLARE_CHECKS }}

  # Site path: redeploy hosting/ against the app build from the latest RELEASE, so a landing-page edit
  # reaches formamorph.ai without cutting a release and without shipping unreleased app code. The
  # `formamorph-web-<version>.zip` asset it downloads exists on every release, and the tag-version guard
  # in the build job is what keeps that name predictable.
  cloudflare-site:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.site_only }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the latest released web build
        id: zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `releases/latest` skips drafts and pre-releases, so a beta never becomes what /play/ serves.
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "Pairing the site with the app from $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'formamorph-web-*.zip' --dir web-zip
          echo "path=$(ls web-zip/formamorph-web-*.zip)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/deploy-site
        with:
          web-zip: ${{ steps.zip.outputs.path }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          run-checks: ${{ vars.CLOUDFLARE_CHECKS }}
