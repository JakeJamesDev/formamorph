name: Release

# Build release artifacts for every tagged release. Each desktop runner packages for its own OS
# (electron-builder can't reliably cross-build AppImage from Windows), so the matrix produces the Windows
# portable .exe, Linux AppImage, and macOS .dmg from one tag. A separate `web` job zips the browser build
# (full config — community on) as formamorph-web-<tag>.zip, ready to drop onto itch.io or any static host.
# Everything is uploaded to the GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `build` is the portability class baked into the app (FORMAMORPH_BUILD → footer tag). The Windows
        # portable .exe and the Linux AppImage are both relocatable → 'portable'; the mac .dmg installs → 'installed'.
        include:
          - os: windows-latest
            script: desktop:build
            build: portable
          - os: ubuntu-latest
            # electron-updater's AppImage self-update needs latest-linux.yml in the release, which is only
            # produced when publishing — so Linux publishes directly (a draft the `publish` job finalizes).
            script: desktop:build:linux:publish
            build: portable
          - os: macos-latest
            script: desktop:build:mac
            build: installed
    runs-on: ${{ matrix.os }}
    # contents: write lets the Linux electron-builder step publish its AppImage + latest-linux.yml draft.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          FORMAMORPH_BUILD: ${{ matrix.build }}
          # Only the Linux --publish step consumes this; the Windows/mac --publish never scripts ignore it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Windows: build the Go launcher, then assemble the distributable — launcher at the clean root + the
      # electron `dir` payload under app/. Produces the full-root zip (first-time download) plus the app
      # payload zip + its sha512 (the update unit the running app downloads and the launcher swaps in).
      - if: matrix.os == 'windows-latest'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - if: matrix.os == 'windows-latest'
        name: Assemble Windows launcher distributable
        shell: bash
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          mkdir -p release/root/app
          (cd launcher && go build -trimpath -ldflags "-s -w" -o "../release/root/Formamorph.exe" .)
          cp -r release/win-unpacked/* release/root/app/
          (cd release/root && 7z a -tzip "../Formamorph-${VER}-win.zip" . >/dev/null)
          (cd release/win-unpacked && 7z a -tzip "../app-${VER}-win.zip" . >/dev/null)
          (cd release && sha512sum "app-${VER}-win.zip" | cut -d' ' -f1 > "app-${VER}-win.zip.sha512")
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.dmg
            release/*-win.zip
            release/*-win.zip.sha512
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # No env overrides → full build (community on, full tag data), unlike the Pages demo build.
      # FORMAMORPH_BUILD=web keeps the footer bare (no build tag) for the browser build.
      - run: npm run build
        env:
          FORMAMORPH_BUILD: web
      # Zip from inside dist so index.html sits at the zip root (itch.io requires this to serve it).
      - name: Zip web build
        run: cd dist && zip -r "../formamorph-web-${{ github.ref_name }}.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: formamorph-web-*.zip
          if-no-files-found: error

  publish:
    needs: [build, web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # Finalizes the draft the Linux build published (with the AppImage + latest-linux.yml) by attaching the
      # Windows exe, mac dmg, and web zip and flipping it to a published release. AppImage is intentionally
      # omitted here — electron-builder already uploaded it (and its update metadata) to the same tag.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*-win.zip
            artifacts/*-win.zip.sha512
            artifacts/formamorph-web-*.zip
