<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- iOS ignores alpha on a home-screen icon and composites it onto black, so this one is pre-flattened. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Appearance defaults to the OS, which the manifest's single theme_color cannot follow. These override it. -->
    <meta name="theme-color" content="#F6F7F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181D" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies the stored mode and color preset before first paint; theme-provider.tsx and SettingsContext.tsx keep them in sync after. -->
    <script>
      (() => {
        const root = document.documentElement;
        const matches = (query) => matchMedia(query).matches;
        let mode = null;
        let color = null;
        try {
          mode = localStorage.getItem('vite-ui-theme');
          color = localStorage.getItem('FORMAMORPH_themeColor');
        } catch { /* Storage blocked: fall back to the defaults. */ }
        const followingSystem = mode !== 'light' && mode !== 'dark';
        root.classList.add(followingSystem ? (matches('(prefers-color-scheme: dark)') ? 'dark' : 'light') : mode);
        const colors = ['graphite', 'purple', 'blue', 'rose', 'bubblegum', 'forest', 'monochrome', 'highcontrast'];
        if (!colors.includes(color)) {
          const systemContrast = color === null && (mode === null || mode === 'system') && matches('(prefers-contrast: more)');
          color = systemContrast ? 'highcontrast' : 'graphite';
        }
        if (color !== 'blue') root.setAttribute('data-theme', color);
      })();
    </script>
    <!-- Default preset's background until index.css loads; zero specificity so index.css wins. -->
    <style>
      :where(html.light) { background: hsl(220 12% 97%); }
      :where(html.dark) { background: hsl(220 12% 10%); }
      /* The boot bar: the indeterminate bar while the app code loads. React's first render replaces it.
         Hidden until index.css sets --fm-boot-display, so it only ever shows in the theme's colors. */
      .fm-boot-wait { position: fixed; left: 0; right: 0; bottom: 22%; margin: 0 auto; width: 12rem; display: var(--fm-boot-display, none); flex-direction: column; align-items: center; gap: 0.5rem; pointer-events: none; opacity: 0; animation: fm-boot-show 300ms 600ms forwards; }
      .fm-boot-wait span { font-size: 0.75rem; line-height: 1rem; color: hsl(var(--muted-foreground)); }
      .fm-boot-track { position: relative; width: 100%; height: 0.25rem; overflow: hidden; background: hsl(var(--secondary)); }
      .fm-boot-fill { position: absolute; top: 0; bottom: 0; left: 0; width: 33.333%; background: hsl(var(--primary)); animation: fm-boot-slide 1s infinite linear; }
      @keyframes fm-boot-show { to { opacity: 1; } }
      @keyframes fm-boot-slide { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
    </style>
    <title>Formamorph</title>
  </head>
  <body>
    <div id="root">
      <div class="fm-boot-wait">
        <span>Getting Ready…</span>
        <div class="fm-boot-track" role="progressbar" aria-label="Loading"><div class="fm-boot-fill"></div></div>
      </div>
    </div>
    <!-- Tells the welcome intro the boot bar was on screen, so it keeps the bar up instead of flashing it off. -->
    <script>
      document.querySelector('.fm-boot-wait').addEventListener('animationstart', (e) => {
        if (e.animationName === 'fm-boot-show') document.documentElement.dataset.bootWait = 'shown';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
